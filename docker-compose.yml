services:
  cinema-recommender:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    environment:
      PORT: ":8080"
      TZ: Asia/Colombo
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
