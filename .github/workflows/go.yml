name: Quality gates
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: test -z "$(gofmt -l cmd internal pkg)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go build -trimpath ./cmd/api
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: ./scripts/package-browser.sh
      - run: python3 scripts/check-web.py
      - run: docker build -t cinebite:test .
