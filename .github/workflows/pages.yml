name: Build and deploy browser application

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test application
        run: go test ./...
      - name: Package browser application
        run: ./scripts/package-browser.sh
      - name: Check website package
        run: |
          test -s dist/browser/index.html
          test -s dist/browser/assets/wasm/cinebite.wasm
          test -s dist/browser/assets/wasm/wasm_exec.js
      - name: Upload website artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist/browser
          retention-days: 7
      - name: Verify artifact upload
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: test -n "$ARTIFACT_ID"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure deployment
        uses: actions/configure-pages@v5
      - name: Deploy website artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
